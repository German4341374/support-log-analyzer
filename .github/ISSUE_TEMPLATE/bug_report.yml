name: Bug report
description: Report a reproducible parser, analysis, or reporting defect.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Description
      description: Explain the observed and expected behavior without attaching sensitive logs.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Safe reproduction
      description: Use synthetic or fully redacted sample data.
    validations:
      required: true
  - type: input
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true

